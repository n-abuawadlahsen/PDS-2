[project]
name = "app"
version = "0.1.0"
description = "Backend del Proyecto 2 (ICC4201) — coordinacion Canvas + GitHub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.5,<2.6",
    "httpx>=0.27,<0.28",
    "structlog>=24.4,<24.5",
    "cryptography>=43.0,<43.1",
    "pyjwt>=2.9,<2.10",
    "tenacity>=9.0,<9.1",
    "itsdangerous>=2.2,<2.3",
    "python-multipart>=0.0.12,<0.0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "detect-secrets>=1.5,<1.6",
    "freezegun>=1.5,<1.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)/Query(...)/Cookie(...) in argument defaults is the
# framework's own documented pattern (evaluated once per request by FastAPI's DI,
# not at import time), not the mutable-default-argument bug B008 targets.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tabla de datos transcrita literalmente de SPEC 14 S14.7.4: partir cada fila en
# varias lineas la haria mas dificil de cotejar columna a columna contra la
# tabla del SPEC.
"app/trabajos/catalogo.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app.dominio --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
